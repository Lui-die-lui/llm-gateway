name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m app.check_templates

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test extension/test/*.test.js
      - name: Syntax of every extension script
        run: for f in extension/*.js extension/mock/*.js extension/dev/*.js; do node --check "$f"; done

  # The image Railway (or any Docker host) builds: gateway + console. Builds it, starts it, and calls it.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gateway-ci .
      - name: Start the image and check it answers
        run: |
          docker run -d --name gw -p 8000:8000 -e UPSTREAM_MODE=mock -e GATEWAY_ADMIN_TOKEN=ci-only-token gateway-ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS localhost:8000/health
          curl -fsS localhost:8000/v1/rules/builtin > /dev/null
          # the console is served from the same address
          curl -fsS localhost:8000/console/policy | grep -q '<div id="root">'
          # admin endpoints need the token
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/v1/policy)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Admin-Token: ci-only-token' localhost:8000/v1/policy)" = 200
      - name: Container log
        if: always()
        run: docker logs gw
