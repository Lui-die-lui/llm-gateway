# 이커머스 운영 템플릿. 초안: 파일명 앞의 `_` 때문에 서버가 로드하지 않음 (`_`를 떼면 활성화).
# 스키마: app/taxonomy.py, 가이드: docs/TAXONOMY.md
# 검사 명령: python -m app.check_templates   (`_` 파일은 건너뜀. 초안을 검사하려면 `_`를 뗀 사본을 다른 폴더에 두고 실행)
industry: ecommerce
entities:
  - id: order_number             # 주문/결제/취소/반품 번호
    label: 주문번호
    detection:
      # Capture group 1 = 번호 값만.
      patterns: ['(?:주문|결제|취소|반품)\s*(?:번호|No\.?)\s*[:：]?\s*([A-Z0-9][A-Z0-9-]{7,})']
    sensitivity: medium
    action: redact
    regulation: ['전자상거래법', '개인정보보호법']

  - id: tracking_number          # 송장번호 (10~13자리 숫자)
    label: 송장번호
    detection:
      # 01x 로 시작하는 값은 제외: 하이픈 없는 휴대전화번호(01012345678)가 송장으로 둔갑하지 않게 한다.
      # 앞뒤 숫자/하이픈 금지: 하이픈이 있는 전화번호, 계좌번호의 일부를 잘라 잡지 않게 한다.
      patterns: ['(?<![\d-])(?!01[016789]\d{7,8}(?!\d))(\d{10,13})(?![\d-])']
      context_keywords: ['송장', '운송장', '택배']
    sensitivity: medium
    action: redact
    regulation: ['개인정보보호법']

  - id: shipping_address         # 배송지 (시/도 + 시/군/구 + 로/길 + 번지)
    label: 배송지
    detection:
      # 주소 형태 전체가 민감값. 키워드 없이는 일반 주소 언급까지 걸리므로 context_keywords 필수.
      patterns: ['((?:서울특별시|서울시|서울|부산광역시|부산시|부산|대구광역시|대구시|대구|인천광역시|인천시|인천|광주광역시|광주시|광주|대전광역시|대전시|대전|울산광역시|울산시|울산|세종특별자치시|세종시|세종|경기도|경기|강원특별자치도|강원도|강원|충청북도|충북|충청남도|충남|전북특별자치도|전라북도|전북|전라남도|전남|경상북도|경북|경상남도|경남|제주특별자치도|제주도|제주)\s*[가-힣]{1,5}(?:시|군|구)\s*(?:[가-힣]{1,5}구\s*)?[가-힣0-9]{1,10}(?:로|길)(?:\s*\d+번길)?\s*\d+(?:-\d+)?(?:\s*\d{1,4}동)?(?:\s*\d{1,4}호)?(?:\s*\d{1,3}층)?)']
      context_keywords: ['배송지', '주소', '받는 분', '받는분', '수령']
      ner_hint: "고객의 배송지 주소"
    sensitivity: high
    action: redact
    regulation: ['개인정보보호법', '전자상거래법']

  - id: coupon_code              # 쿠폰/프로모션 코드
    label: 쿠폰코드
    detection:
      # Capture group 1 = 코드 값만. 숫자가 하나 이상 들어간 6자 이상만 (WELCOME 같은 영단어 제외).
      patterns: ['(?:쿠폰|프로모션|할인코드)(?:\s*(?:코드|번호))?\s*[:：]?\s*((?=[A-Z0-9-]*\d)[A-Z0-9][A-Z0-9-]{5,})']
    sensitivity: medium
    action: redact

  - id: supply_price             # 매입가, 공급가, 마진, 원가
    label: 공급가
    detection:
      # 키워드 바로 뒤의 금액 또는 % 만. 같은 문장의 일반 판매가는 건드리지 않는다.
      patterns: ['(?:매입가|공급가|공급단가|마진율?|원가)\s*[:：]?\s*(\d[\d,]*(?:\.\d+)?\s*(?:억\s*(?:\d[\d,]*\s*(?:천만|백만|만)\s*)?|천만\s*|백만\s*|만\s*)?원|\d+(?:\.\d+)?\s*%)']
      ner_hint: "거래처 매입가, 공급가, 마진율"
    sensitivity: high
    action: redact
    regulation: ['영업비밀보호법']

applies_to:
  use_cases: [customer_support, document_summary]
  flow: internal_db_to_llm

tests:
  - text: "주문번호 20240315-0001234 취소 요청"
    detect: ["20240315-0001234"]
  - text: "반품 No: RT-2024-00099 접수"
    detect: ["RT-2024-00099"]
  - text: "택배 운송장 123456789012 배송 조회"
    detect: ["123456789012"]
  - text: "배송지: 서울 가나구 다라로 123 4층, 받는 분 연락 요망"
    detect: ["서울 가나구 다라로 123"]
  - text: "주소 경기도 마바시 사아구 자차길 7-2 로 보내주세요"
    detect: ["경기도 마바시 사아구 자차길 7-2"]
  - text: "쿠폰 WELCOME-8F2K 적용 안 됨"
    detect: ["WELCOME-8F2K"]
  - text: "프로모션 코드: SPRING2024 문의"
    detect: ["SPRING2024"]
  - text: "매입가 12,000원, 공급가: 15,500원, 마진 22%"
    detect: ["12,000원", "15,500원", "22%"]
  - text: "주문번호 확인 요청"                                  # 번호 값 없음 -> untouched
    detect: []
  - text: "택배 기사 연락처 01012345678"                        # 하이픈 없는 전화번호는 송장 아님 -> untouched
    detect: []
  - text: "운송장 010-1234-5678 문의"                          # 하이픈 있는 전화번호 -> untouched
    detect: []
  - text: "주문 후 3일 소요, 번호 1234567890123"                # 송장 키워드 없음 -> untouched
    detect: []
  - text: "서울 지사 방문 일정 주소 확인 요청"                  # 주소 키워드는 있지만 번지가 없음 -> untouched
    detect: []
  - text: "서울 가나구 다라로 123 점심 맛집 추천"              # 주소 키워드 없음 -> untouched
    detect: []
  - text: "쿠폰 WELCOME 이벤트 안내"                          # 숫자 없는 영단어 -> untouched
    detect: []
  - text: "일반 판매가 29,900원, 할인 20%"                    # 공급가 키워드 없음 -> untouched
    detect: []
  - text: "마진 개선 방안 논의"                                # 값 없음 -> untouched
    detect: []
