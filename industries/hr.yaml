# 인사(HR, 전 산업 공통) 템플릿. 스키마: app/taxonomy.py, 가이드: docs/TAXONOMY.md
# 검사 명령: python -m app.check_templates
industry: hr
entities:
  - id: salary                   # 연봉, 급여, 성과급
    label: 급여
    detection:
      # Capture group 1 = 금액만. 5천만원, 4,800만원, 1억 2000만원 형태.
      patterns: ['(?:연봉|월급|급여|기본급|성과급|상여금|인센티브)\s*[:：]?\s*(\d[\d,]*(?:\.\d+)?\s*(?:억\s*(?:\d[\d,]*\s*(?:천만|백만|만)\s*)?|천만\s*|백만\s*|만\s*)?원)']
      ner_hint: "직원의 연봉, 급여, 성과급 금액"
    sensitivity: high
    action: redact
    regulation: ['개인정보보호법']

  - id: employee_id              # 사번
    label: 사번
    detection:
      patterns: ['(?:사번|직원번호|사원번호)\s*[:：]?\s*([A-Z]{0,3}\d{5,8})(?!\d)']
    sensitivity: medium
    action: redact
    regulation: ['개인정보보호법']

  - id: performance_rating       # 인사평가 등급
    label: 인사평가
    detection:
      patterns: ['(?:인사평가|평가등급|인사고과|고과등급|성과등급)\s*[:：]?\s*([SABCD][+-]?(?![A-Za-z])|[1-5]\s*등급|미흡|부진)']
    sensitivity: high
    action: redact
    regulation: ['개인정보보호법']

  - id: disciplinary_reason      # 징계/해고/퇴직 사유
    label: 징계사유
    detection:
      # 사유 문장은 쉼표, 마침표, 세미콜론, 줄바꿈 전까지 최대 30자.
      patterns: ['(?:징계|해고|퇴직|권고사직)\s*사유\s*[:：]\s*([^\n,.;]{2,30})']
      ner_hint: "직원의 징계, 해고, 퇴직 사유"
    sensitivity: high
    action: redact
    regulation: ['개인정보보호법']

  - id: criminal_record          # 범죄경력 (민감정보)
    label: 범죄경력
    detection:
      patterns: ['(?:범죄경력|전과)\s*[:：]\s*([^\n,.;]{1,30})']
    sensitivity: critical
    action: redact
    regulation: ['개인정보보호법']

  - id: recruitment_score        # 채용 면접/서류/필기 평가 점수
    label: 채용평가
    detection:
      # Capture group 1 = 점수 값만. 분모는 100 만 인정 (면접 3/15 같은 날짜와 구분).
      patterns: ['(?:면접|서류|필기|코딩테스트|인성검사)\s*(?:평가|전형)?\s*(?:점수|결과)?\s*[:：]?\s*(\d{1,3}(?:\.\d+)?\s*점(?:\s*/\s*100\s*점?)?|\d{1,3}(?:\.\d+)?\s*/\s*100(?!\d))']
      ner_hint: "지원자의 면접 또는 서류 평가 점수"
    sensitivity: high
    action: redact
    regulation: ['채용절차법', '개인정보보호법']

applies_to:
  use_cases: [document_summary, translation]
  flow: internal_db_to_llm

tests:
  - text: "연봉: 5천만원, 성과급 1,200만원 지급 검토"
    detect: ["5천만원", "1,200만원"]
  - text: "사번 20190345 영업팀 이동 기록"
    detect: ["20190345"]
  - text: "인사고과 B+ 통보, 평가등급: 3등급"
    detect: ["B+", "3등급"]
  - text: "징계 사유: 근태 불량 및 무단결근, 후속 조치 문의"
    detect: ["근태 불량 및 무단결근"]
  - text: "범죄경력: 음주운전 벌금형 이력 확인"
    detect: ["음주운전 벌금형 이력 확인"]
  - text: "연봉 협상 일정 공유"                       # 금액 없음 -> untouched
    detect: []
  - text: "주문번호 20190345 확인"                    # 사번 키워드 없음 -> untouched
    detect: []
  - text: "인사평가 절차 개선안 검토"                 # 등급 값 없음 -> untouched
    detect: []
  - text: "퇴직 연금 제도 안내문 작성"                # 사유 항목 없음 -> untouched
    detect: []
  - text: "범죄경력 조회 절차 안내"                   # 값 없음 -> untouched
    detect: []
  - text: "면접 점수 85점, 서류 평가: 92.5점 기록"
    detect: ["85점", "92.5점"]
  - text: "코딩테스트 78/100 통과"
    detect: ["78/100"]
  - text: "면접 3/15 일정 공지"                        # 날짜이지 점수가 아님 -> untouched
    detect: []
  - text: "면접 준비 팁 100점 만점 기준 정리"           # 키워드 바로 뒤에 점수가 아님 -> untouched
    detect: []
