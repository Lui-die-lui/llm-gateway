<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>fake chat (extension dev page)</title>
  <style>
    body{margin:0;font:15px/1.7 system-ui,sans-serif;background:#fff;color:#18181B}
    #app{max-width:760px;margin:0 auto;padding:24px 20px 140px}
    #log{display:flex;flex-direction:column;gap:14px}
    .me{align-self:flex-end;max-width:76%;background:#F4F4F5;border-radius:18px;padding:10px 16px}
    .bot{max-width:680px}
    #composer-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;width:min(720px,calc(100% - 40px));border:1px solid #E4E4E7;border-radius:24px;padding:12px;background:#fff;box-shadow:0 6px 24px -12px rgba(0,0,0,.15)}
    #prompt-textarea,#box{min-height:34px;padding:4px 8px;outline:none}
    #prompt-textarea:empty::before,#box:empty::before{content:"메시지를 입력하세요";color:#A1A1AA}
    .bar{display:flex;justify-content:flex-end}
    button[data-testid=send-button]{width:36px;height:36px;border-radius:50%;border:0;background:#18181B;color:#fff;cursor:pointer}
    pre{background:#F4F4F5;padding:10px;border-radius:10px;font-size:12px;white-space:pre-wrap}
  </style>
</head>
<body>
  <!-- Mimics the parts of ChatGPT's page that content.js touches. Serve extension/ and open /dev/fake-chat.html
       ?industries=cosmetics  &enabled=0  &reply=echo|plain|fuzzy|newpii  &layout=changed (composer selector no longer matches) | arrow (send arrow selector no longer matches) -->
  <div id="app">
    <div id="log"></div>
    <pre id="sent" data-gw-skip aria-label="외부로 나가는 문장"></pre>
  </div>
  <div id="composer-wrap">
    <div id="composer" contenteditable="true" role="textbox" aria-label="메시지"></div>
    <div class="bar"><button data-testid="send-button" aria-label="보내기">↑</button></div>
  </div>
  <script>
    // layout=changed: the site renamed its composer, so the selector table no longer matches (safe mode).
    (() => {
      const mode = new URLSearchParams(location.search).get("layout");
      document.getElementById("composer").id = mode === "changed" ? "box" : "prompt-textarea";
    })();
  </script>
  <script src="shim.js"></script>
  <script src="../lib.js"></script>
  <script src="../background.js"></script>
  <script src="../ui.js"></script>
  <script src="../mock/files.js"></script>
  <script>
    (() => {
    const reply = new URLSearchParams(location.search).get("reply") || "echo";
    const composer = document.querySelector("[contenteditable]");
    function send() {
      const text = composer.innerText.trim();
      if (!text) return;
      document.getElementById("sent").textContent = text; // what would leave for the external LLM
      const me = document.createElement("div");
      me.className = "me";
      if (reply !== "dil") me.dataset.messageAuthorRole = "user"; // ChatGPT's newer markup carries no role attribute
      me.textContent = text;
      const turn = reply === "chatgpt" ? document.createElement("article") : null; // ChatGPT wraps each side in an <article>
      if (turn) (turn.dataset.testid = "conversation-turn-1"), turn.append(me);
      document.getElementById("log").append(turn || me);
      composer.textContent = "";
      if (reply === "chatgpt") return chatgptReply(text);
      if (reply === "dil") return dilReply(text);
      setTimeout(() => {
        const bot = document.createElement("div");
        bot.className = "bot";
        bot.dataset.messageAuthorRole = "assistant";
        bot.textContent =
          reply === "plain" ? "고객님께 보낼 안내 요약입니다. 회신 주소와 배합 비율은 기존 문서를 참고해 주세요. 추가로 필요한 내용이 있으면 말씀해 주세요."
          : reply === "fuzzy" ? "답변: " + text.replace(/\[([^\[\]\s_]+)_(\d+)\]/g, "[$1 $2]")
          : reply === "newpii" ? "예시 고객 정보로 테스트하세요: 이름 김철수, 주민번호 850101-1234567 입니다."
          : "답변: " + text; // a model that echoes what it was sent
        document.getElementById("log").append(bot);
      }, 200);
    }
    // Newer ChatGPT markup: the answer sits in a separate renderer root (no author-role attribute) and placeholders are in <code>.
    function dilReply(text) {
      const ph = text.match(/\[[^\[\]\s]+_\d+\]/g) || [];
      const root = document.createElement("div");
      root.dataset.dilMessageId = "x";
      for (const [label, v] of [["받는 사람: ", ph[1]], ["수신 고객: ", ph[0]]]) {
        const p = document.createElement("p");
        const code = document.createElement("code");
        code.textContent = v || "";
        p.append(label, code);
        root.append(p);
      }
      root.append(Object.assign(document.createElement("p"), { textContent: "현재 메일 발송 기능이 연결되어 있지 않아 직접 전송할 수는 없어." }));
      document.getElementById("log").append(root);
    }
    // ChatGPT-like answer: streamed text in the assistant element, plus a mail card drawn outside it but inside the turn.
    function chatgptReply(text) {
      const ph = text.match(/\[[^\[\]\s]+_\d+\]/g) || [];
      const turn = document.createElement("article");
      turn.dataset.testid = "conversation-turn-2";
      const bot = document.createElement("div");
      bot.dataset.messageAuthorRole = "assistant";
      const p = document.createElement("p");
      const t1 = document.createTextNode("");
      const strong = document.createElement("strong");
      strong.textContent = "배송 지연 사과 메일";
      p.append(t1, strong, document.createTextNode("을 준비했습니다."));
      bot.append(p);
      const card = document.createElement("div");
      card.className = "mailcard";
      card.textContent = "받는 사람: " + (ph[1] || "") + " / 안녕하세요, " + (ph[0] || "") + " 고객님.";
      turn.append(bot, card);
      document.getElementById("log").append(turn);
      const full = "고객 " + (ph[0] || "") + "에게 보낼 ";
      let i = 0;
      const timer = setInterval(() => {  // like a streaming renderer: the same text node is rewritten with longer text
        t1.nodeValue = full.slice(0, ++i);
        if (i >= full.length) clearInterval(timer);
      }, 25);
    }
    const sendBtn = document.querySelector("[data-testid=send-button]");
    sendBtn.addEventListener("click", send);
    // layout=arrow: the site renamed its send arrow, so the selector table no longer matches it (a plain submit button, no label).
    if (new URLSearchParams(location.search).get("layout") === "arrow") {
      sendBtn.removeAttribute("data-testid");
      sendBtn.removeAttribute("aria-label");
      sendBtn.type = "submit";
      sendBtn.style.cssText = "width:36px;height:36px;border-radius:50%;border:0;background:#18181B;color:#fff;cursor:pointer";
    }
    composer.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
    });
    })();
  </script>
  <input type="file" id="fake-file" multiple aria-label="파일 첨부" style="position:fixed;left:8px;bottom:8px">
  <script src="../content.js"></script>
</body>
</html>
