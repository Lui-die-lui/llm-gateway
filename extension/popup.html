<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=360">
  <title>Gateway</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="pop">
    <header class="top">
      <span class="brand">
        <span class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6zM9 12l2 2 4-4"/></svg></span>
        <span><b>Gateway</b><small id="ver"></small></span>
      </span>
      <button type="button" id="enabled" class="tog" role="switch" aria-checked="true" aria-label="보호 켜기"></button>
    </header>

    <div id="status" class="status" role="status" aria-live="polite">
      <i class="dot" id="dot"></i>
      <span><b id="status-title">확인 중…</b><small id="status-sub"></small></span>
    </div>

    <section class="card nums" aria-label="오늘 현황">
      <div><b id="n-checked" class="mono">0</b><small>오늘 검사</small></div>
      <div><b id="n-redacted" class="mono warn">0</b><small>가림</small></div>
      <div><b id="n-blocked" class="mono bad">0</b><small>차단</small></div>
    </section>

    <section class="card" aria-labelledby="ind-h">
      <h2 id="ind-h">산업 템플릿</h2>
      <div id="industries" class="inds">불러오는 중…</div>
      <p class="hint">공통 개인정보 · 시크릿은 항상 켜져 있어요</p>
    </section>

    <section class="card" aria-labelledby="me-h">
      <h2 id="me-h">내 계정</h2>
      <div id="me-state" class="hint" role="status">확인 중…</div>
      <form id="me-form" hidden>
        <div class="row">
          <input id="me-mail" type="email" placeholder="회사 메일 주소" autocomplete="email" spellcheck="false" aria-label="회사 메일 주소">
          <button type="submit" class="btn small">연결</button>
        </div>
        <p class="hint">관리자가 승인한 구성원의 메일을 넣으면, 이 브라우저에서 보낸 글이 기록에 내 이름과 부서로 남아요.</p>
      </form>
      <button type="button" id="me-unlink" class="btn small" hidden>연결 끊기</button>
    </section>

    <section class="card" aria-labelledby="ex-h">
      <h2 id="ex-h">내 예외 요청</h2>
      <div id="exceptions" class="exlist hint">확인 중…</div>
    </section>

    <section class="links">
      <a class="btn" id="open-portal" href="#" target="_blank" rel="noopener">자세히 보기</a>
      <a class="btn dark" id="open-console" href="#" target="_blank" rel="noopener">관리자 콘솔 ↗</a>
    </section>

    <details class="card adv">
      <summary>연결 설정</summary>
      <form id="gw">
        <label for="gw-url">게이트웨이 주소</label>
        <div class="row">
          <input id="gw-url" type="url" placeholder="http://localhost:8000" spellcheck="false">
          <button type="submit" class="btn small">저장</button>
        </div>
        <label for="gw-key">접속 키 (회사에서 받은 경우)</label>
        <input id="gw-key" type="password" placeholder="gw_..." autocomplete="off" spellcheck="false">
        <label class="opt"><input type="checkbox" id="hint"><span>가린 자리 안내 문장 붙이기<small>없으면 AI가 [사람_1]을 빈칸으로 읽고 되물을 수 있어요</small></span></label>
        <div class="lbl-s" id="tf-l">예외 승인 남은 시간 표시</div>
        <div class="seg" role="radiogroup" aria-labelledby="tf-l">
          <label><input type="radio" name="timeFormat" value="clock"><span>59:03</span></label>
          <label><input type="radio" name="timeFormat" value="text"><span>59분 03초</span></label>
        </div>
        <div class="lbl-s">이 탭 상태</div>
        <div id="page" class="hint" role="status">확인 중…</div>
        <div id="gw-msg" class="hint" role="status"></div>
      </form>
    </details>
  </main>
  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
