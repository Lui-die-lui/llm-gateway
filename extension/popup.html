<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=340">
  <title>Gateway</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="pop">
    <header class="top">
      <span class="brand">
        <span class="logo" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6zM9 12l2 2 4-4"/></svg></span>
        <span><b>Gateway</b><small id="ver"></small></span>
      </span>
      <button type="button" id="enabled" class="tog" role="switch" aria-checked="true" aria-label="보호 켜기"></button>
    </header>

    <div id="status" class="status" role="status" aria-live="polite">
      <i class="dot" id="dot"></i>
      <span><b id="status-title">확인 중…</b><small id="status-sub"></small></span>
    </div>

    <section class="sec" aria-labelledby="ind-h">
      <h2 id="ind-h">산업 템플릿</h2>
      <div id="industries" class="inds">불러오는 중…</div>
      <p class="hint">공통 개인정보 · 시크릿은 항상 켜져 있어요</p>
    </section>

    <section class="sec nums" aria-label="오늘 현황">
      <div><b id="n-checked" class="mono">0</b><small>오늘 검사</small></div>
      <div><b id="n-redacted" class="mono warn">0</b><small>가림</small></div>
      <div><b id="n-blocked" class="mono bad">0</b><small>차단</small></div>
    </section>

    <section class="sec links">
      <a class="btn" id="open-portal" href="#" target="_blank" rel="noopener">전체 보기</a>
      <a class="btn dark" id="open-console" href="#" target="_blank" rel="noopener">관리자 콘솔 ↗</a>
    </section>

    <details class="sec adv">
      <summary>연결 설정</summary>
      <form id="gw">
        <label for="gw-url">게이트웨이 주소</label>
        <div class="row">
          <input id="gw-url" type="url" placeholder="http://localhost:8000" spellcheck="false">
          <button type="submit" class="btn small">저장</button>
        </div>
        <label for="portal-url">전체 보기 화면 주소 (비우면 자동)</label>
        <input id="portal-url" type="url" placeholder="http://localhost:3000" spellcheck="false">
        <label class="chk"><input type="checkbox" id="hint"> 가린 자리 안내 문장 붙이기 <small>없으면 AI가 [사람_1]을 빈칸으로 읽고 되물을 수 있어요</small></label>
        <label class="chk"><input type="checkbox" id="demo-files"> 파일 검사 데모 켜기 <small>실제 검사가 아니며 파일이 사이트에 올라가지 않아요</small></label>
        <a class="link" id="open-auth" href="auth.html" target="_blank" rel="noopener">회사 계정 가입·로그인 화면 보기 (데모)</a>
        <div id="gw-msg" class="hint" role="status"></div>
      </form>
    </details>
  </main>
  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
